<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout page </title>
    <link rel="shortcut icon" href="./resources/favicon.ico" type="image/x-icon">   
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <div class="main">
        <br><br><br><br>
        <h1>checkout <span>3items</span></h1>
        <div class="container">
            <div class="boxes ">
                
                <div class="box_left">
                    <div class="item">
                        <div class="img">
                           <div style="width: 100px; height: 100px; background-color: #FFFF; border-radius: 20px;"> <img src="./resources/Apple-watch.png" alt="apple_watch"></div>
                            <div class="details_product">
                                <h2>Apple Watch</h2>
                                <p>blue</p>
                                <span>1X</span>
                            </div>
                        </div>
                        <div class="details"> 
                            
                            <span class="price">$ 200</span>
                            <div class="btns">
                                <button class="btn">x</button>
                                </div></div></div>
                                <!-- new item -->
                                <div class="item">
                                    <div class="img">
                                       <div style="width: 100px; height: 200px; background-color: #FFFF; border-radius: 20px;"> <img src="./resources/Gold@2x.png" alt="apple_watch"></div>
                                        <div class="details_product">
                                            <h2>iphone pro 12 </h2>
                                            <p>golder</p>
                                            <span>1X</span>
                                        </div>
                                    </div>
                                    <div class="details"> 
                                        
                                        <span class="price">$999.00</span>
                                        <div class="btns">
                                            <button class="btn">x</button>
                                            </div></div></div>
                                             <!-- new item -->
                                <div class="item">
                                    <div class="img">
                                       <div style="width: 100px; height: 100px; background-color: #FFFF; border-radius: 20px;"> <img src="./resources/iMac.png" alt="apple_watch"></div>
                                        <div class="details_product">
                                            <h2>i MAC </h2>
                                            <p>green</p>
                                            <span>1X</span>
                                        </div>
                                    </div>
                                    <div class="details"> 
                                        
                                        <span class="price">$1200.00</span>
                                        <div class="btns">
                                            <button class="btn">x</button>
                                            </div></div></div>  
                                            <!-- end item    -->
                                             <!-- get and apply details  -->
                                              <hr> 
                                              <div class="get_detail">
                                               <div class="input"> <input type="text" name="" id="code" placeholder="entry your code "> <button> apply coupon</button> </div>                                        
                                              </div>
                                              <div class="extar_details" >
                                              <div class="summary">  
                                                <div class="subtotal">  
                                                    <div>sub total</div> 
                                                    <div>2597</div>
                                                </div>
                                                
                                                <div class="subtotal">  
                                                    <div>tax</div> 
                                                    <div>623</div>
                                                </div>
                                                
                                                <div class="subtotal">  
                                                    <div>total</div> 
                                                    <div>3220</div>
                                                </div>
                                              </div>
                                                
                                                
                                               </div>
                                            </div>

                <div class="box_right">
                    <div class="form">
                        <h2>your contact info</h2>
                        <form action="">
                            <label for="name">First and Last Name</label><br>
                            <input type="text" id="name" name="name" placeholder="Enter your full name" required><br>
                            <label for="email">email address</label><br>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            <div class="input_box" style="display: flex; justify-content: space-between; width: 100%; gap: 2%;">
                               <div style="width: 50%;"> <label for="country">select country  </label>  <br>  
                                <select name="country" id="country" style="width: 100%; padding: 10px; border-radius: 20px;">
                                    <option value="select"> ---select---</option>
                                    <option value="us">United States</option>
                                    <option value="ca">Canada</option>
                                    <option value="uk">United Kingdom</option>
                                    <option value="au">Australia</option>
                                    <option value="in">India</option>
                                    <option value="de">Germany</option>
                                    <option value="fr">France</option>
                                    <option value="jp">Japan</option>
                                    <option value="cn">China</option>
                                    <option value="br">Brazil</option>
                                </select> </div>   <br>
                                <div style="width: 40%;">
                                <label for="code "> postcode </label>  <br>
                                <input type="text" name="code " id="code " placeholder="entry post code" style="width: 100%; "> </div>

                                    
                                

                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    
</body>
</html>
